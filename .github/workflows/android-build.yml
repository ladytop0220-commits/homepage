name: Build 안녕 APK

# android/ 안의 코드가 바뀌면 GitHub 클라우드에서 자동으로 APK를 빌드합니다.
# 완성된 APK는 (1) Actions 아티팩트, (2) 'apk-latest' 릴리스에 첨부되어
# 회원님이 폰으로 바로 내려받아 설치할 수 있습니다.

on:
  push:
    branches:
      - "claude/elderly-phone-assistant-app-vmpzya"
      - "main"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: SDK 라이선스/패키지 준비
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: gradlew 실행 권한
        run: chmod +x android/gradlew

      - name: 디버그 APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk annyeong-debug.apk

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: annyeong-debug-apk
          path: annyeong-debug.apk
          if-no-files-found: error

      - name: 릴리스에 APK 첨부 (폰에서 바로 내려받기)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "안녕 최신 APK"
          body: |
            어르신 전화·안부 보조 앱 '안녕'의 최신 디버그 APK입니다.
            폰에서 이 파일을 내려받아 설치하세요. (설정 > 출처를 알 수 없는 앱 설치 허용 필요)
          files: annyeong-debug.apk
